<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>總務課管理中心｜管理員登入</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6f3;color:#26332c;font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column}.header{background:#14532d;color:white;padding:22px 24px}.inner{max-width:920px;margin:auto}.system-name{font-size:14px;letter-spacing:.08em;opacity:.88;margin-bottom:5px}.header-title{font-size:22px;font-weight:600;letter-spacing:.04em;margin:0;color:#fff}.area{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:60px 20px}.card{width:100%;max-width:460px;background:white;border:1px solid #dfe7e1;border-radius:14px;padding:38px 40px;box-shadow:0 4px 14px #1f372014}h1{font-size:25px;color:#174c2d}p{color:#748078;font-size:14px;line-height:1.7}label{display:block;margin:18px 0 8px;font-weight:600}input{width:100%;padding:13px;border:1px solid #cfd9d2;border-radius:8px;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#17613a;color:white;font-size:16px;font-weight:600;cursor:pointer}.notice{margin-top:22px;padding:12px;background:#edf5ef;border-radius:8px;color:#5f7065;font-size:13px;line-height:1.6}@media(max-width:600px){.area{padding:32px 16px}.card{padding:30px 24px}}
</style>
</head>
<body>
<header class="header"><div class="inner"><div class="system-name">淡水信用合作社</div><h1 class="header-title">總務課管理中心</h1></div></header>
<main class="area"><section class="card">
<h1>管理中心登入</h1>
<p>請使用核准的管理帳號登入，以進入四套業務系統的統一管理中心。</p>
<form id="loginForm">
<label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="請輸入管理帳號" required>
<label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required>
<button type="submit">登入管理中心</button>
<button id="signupBtn" type="button" style="margin-top:10px;background:#edf5ef;color:#17613a;border:1px solid #d5e2d5">首次使用｜建立個人帳號</button>
<button id="resetBtn" type="button" style="margin-top:10px;background:#fff;color:#17613a;border:1px solid #d5e2d5">忘記密碼／寄送重設連結</button>
<div id="authMessage" style="margin-top:14px;font-size:13px;line-height:1.7;color:#52665a;white-space:pre-wrap"></div>
</form>
<section id="resetPasswordView" style="display:none;margin-top:18px;padding-top:18px;border-top:1px solid #e2e9e3">
<h2 style="font-size:19px;color:#174c2d">設定新密碼</h2>
<p>請輸入新密碼，至少 8 個字元。</p>
<label for="recoveryPassword">新密碼</label><input id="recoveryPassword" type="password" autocomplete="new-password" minlength="8">
<label for="recoveryPassword2">再次輸入新密碼</label><input id="recoveryPassword2" type="password" autocomplete="new-password" minlength="8">
<button id="saveRecoveryPassword" type="button">儲存新密碼</button>
<div id="recoveryMessage" style="margin-top:12px;font-size:13px;white-space:pre-wrap"></div>
</section>
<div class="notice">本管理中心僅供總務課授權管理人員使用，登入後可切換庫存盤點、傳票耗材、紙張需求及活動報名管理。</div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://onebxqajsiqmhfcizaxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_" + "TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
function showMessage(text, isError=false){ $("authMessage").textContent=text; $("authMessage").style.color=isError?"#b91c1c":"#52665a"; }
async function authorizedUser(email){
 const r=await authClient.from("admin_authorizations").select("email,role,is_active").eq("email",email).eq("is_active",true).maybeSingle();
 if(r.error) throw r.error;
 return r.data;
}
async function finishLogin(data,email){
 if(!data.session||!data.user) throw new Error("登入後未取得有效的帳號狀態。");
 const actual=(data.user.email||"").toLowerCase();
 if(actual!==email) throw new Error("登入信箱與帳號資料不一致。");
 const auth=await authorizedUser(actual);
 if(!auth){await authClient.auth.signOut();throw new Error("此信箱尚未獲授權，或管理權限已停用。請洽最高管理員。");}
 localStorage.setItem("admin_access_token",data.session.access_token);
 localStorage.setItem("admin_refresh_token",data.session.refresh_token);
 localStorage.setItem("admin_email",actual);
 localStorage.setItem("admin_role",auth.role);
 window.location.href="https://tscgad917.github.io/inventory-system/admin-center.html";
}
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const email=$("email").value.trim().toLowerCase(),password=$("password").value;
 showMessage("正在驗證帳號……");
 try{const {data,error}=await authClient.auth.signInWithPassword({email,password});if(error)throw error;await finishLogin(data,email);}
 catch(error){console.error("登入失敗：",error);showMessage("登入失敗："+(error&&error.message?error.message:"請確認帳號、密碼及授權狀態。"),true);}
});
$("signupBtn").addEventListener("click",async()=>{
 const email=$("email").value.trim().toLowerCase(),password=$("password").value;
 if(!email||!password){showMessage("請先輸入管理員已核准的 Email 及自行設定的密碼。",true);return;}
 if(password.length<8){showMessage("密碼至少需要 8 個字元。",true);return;}
 if(!confirm("將以 "+email+" 建立個人登入帳號。請確認最高管理員已先在管理人員名單中新增此信箱。"))return;
 $("signupBtn").disabled=true;showMessage("正在建立個人帳號……");
 try{
  const {data,error}=await authClient.auth.signUp({email,password,options:{emailRedirectTo:"https://tscgad917.github.io/login/"}});
  if(error)throw error;
  if(data.session&&data.user){await finishLogin(data,email);return;}
  showMessage("帳號申請已送出。若系統要求信箱確認，請先開啟收到的確認信，再回到本頁登入。只有已列入管理人員名單的信箱才能進入後台。");
 }catch(error){console.error(error);showMessage("建立帳號失敗："+(error.message||String(error)),true);}
 finally{$("signupBtn").disabled=false;}
});
window.addEventListener("load",async()=>{
 if(!window.location.hash.includes("type=recovery"))return;
 try{
  const r=await authClient.auth.getSession();
  if(r.error)throw r.error;
  if(!r.data.session)throw new Error("重設連結已失效，請重新寄送密碼重設信。");
  $("loginForm").style.display="none";
  $("resetPasswordView").style.display="block";
 }catch(e){showMessage(e.message||String(e),true);}
});
$("saveRecoveryPassword").addEventListener("click",async()=>{
 const p=$("recoveryPassword").value,p2=$("recoveryPassword2").value;
 const out=$("recoveryMessage");
 if(p.length<8){out.textContent="新密碼至少需要 8 個字元。";out.style.color="#b91c1c";return;}
 if(p!==p2){out.textContent="兩次輸入的密碼不一致。";out.style.color="#b91c1c";return;}
 $("saveRecoveryPassword").disabled=true;
 try{
  const r=await authClient.auth.updateUser({password:p});if(r.error)throw r.error;
  await authClient.auth.signOut();
  out.textContent="密碼已更新，正在返回登入頁面……";out.style.color="#166534";
  setTimeout(()=>window.location.replace("https://tscgad917.github.io/login/"),1200);
 }catch(e){out.textContent="密碼更新失敗："+(e.message||String(e));out.style.color="#b91c1c";}
 finally{$("saveRecoveryPassword").disabled=false;}
});
$("resetBtn").addEventListener("click",async()=>{
 const email=$("email").value.trim().toLowerCase();
 if(!email){showMessage("請先輸入要重設密碼的 Email。",true);return;}
 $("resetBtn").disabled=true;
 try{const {error}=await authClient.auth.resetPasswordForEmail(email,{redirectTo:"https://tscgad917.github.io/login/"});if(error)throw error;showMessage("如該信箱已建立帳號，系統將寄送密碼重設連結。請查看收件匣及垃圾郵件。");}
 catch(error){showMessage("無法寄送重設連結："+(error.message||String(error)),true);}
 finally{$("resetBtn").disabled=false;}
});
</script>
</body>
</html>
